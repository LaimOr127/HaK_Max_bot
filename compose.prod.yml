services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  bot:
    environment:
      APP_ENV: production
      MAX_TRANSPORT: webhook
    ports: !reset []
    command: ["uvicorn", "navigator.bootstrap:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${UVICORN_WORKERS:-2}"]

  catalog:
    environment:
      APP_ENV: production

  worker:
    environment:
      APP_ENV: production
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}

  caddy:
    image: caddy:2-alpine
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
