<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигатор льгот</title>
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --soft: #f8fafc;
    --border: #dde3ec;
    --text: #14171f;
    --muted: #6f7785;
    --accent: #2563eb;
    --accent-soft: #eaf1ff;
    --ok: #16834a;
    --ok-soft: #e8f7ef;
    --danger: #d5483f;
    --danger-soft: #fff1f0;
    --shadow: 0 24px 50px rgba(28, 36, 56, .14);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { border: 0; font: inherit; }
  .app {
    max-width: 760px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(12px);
  }
  h1 {
    margin: 0;
    font-size: 19px;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .hint {
    margin-top: 3px;
    color: var(--muted);
    font-size: 13px;
  }
  .content {
    flex: 1;
    padding: 16px;
  }
  .home {
    display: grid;
    gap: 14px;
  }
  .home[hidden] { display: none; }
  .home-nav {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .nav-card,
  .home-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .nav-card {
    display: block;
    padding: 10px;
    color: inherit;
    text-decoration: none;
  }
  .nav-title {
    display: block;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.2;
  }
  .nav-meta {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }
  .home-card {
    overflow: hidden;
  }
  .home-card-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--soft);
  }
  .home-card h2 {
    margin: 0;
    font-size: 17px;
    line-height: 1.25;
  }
  .home-body {
    padding: 14px;
  }
  .profile-text,
  .reason-list,
  .checklist-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .profile-text {
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }
  .home-note {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    line-height: 1.4;
  }
  .recommendations {
    display: grid;
    gap: 10px;
  }
  .recommendation {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .recommendation-title {
    margin: 8px 0 6px;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.3;
  }
  .recommendation-amount {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  .reason-list li,
  .checklist-list li {
    padding: 7px 0;
    border-top: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.4;
  }
  .reason-list li:first-child,
  .checklist-list li:first-child { border-top: 0; }
  .compare {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .measure {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .measure-head {
    padding: 12px;
    background: var(--soft);
    border-bottom: 1px solid var(--border);
  }
  .badge {
    display: inline-flex;
    max-width: 100%;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .measure-title {
    margin: 9px 0 0;
    min-height: 46px;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.25;
  }
  .row {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .row:first-child { border-top: 0; }
  .label {
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .value {
    font-size: 13px;
    font-weight: 650;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .actions {
    display: grid;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  .btn {
    width: 100%;
    min-height: 42px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--soft);
    color: var(--text);
    font-weight: 750;
    cursor: pointer;
  }
  .btn:disabled {
    cursor: default;
    opacity: .65;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-ok {
    background: var(--ok);
    color: #fff;
  }
  .btn-danger {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .details {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .details[hidden],
  .empty[hidden],
  .confirm[hidden],
  .toast[hidden] { display: none; }
  .details-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--soft);
  }
  .details-title {
    margin: 6px 0 0;
    font-size: 18px;
    line-height: 1.25;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #fff;
    color: var(--muted);
    cursor: pointer;
  }
  .section {
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  .section:first-of-type { border-top: 0; }
  .section h3 {
    margin: 0 0 7px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .section p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }
  .docs {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .docs li {
    position: relative;
    padding: 5px 0 5px 16px;
    font-size: 14px;
    line-height: 1.4;
  }
  .docs li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 13px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .confirm {
    margin: 0 14px 14px;
    padding: 12px;
    border: 1px solid #f2cbc7;
    border-radius: 8px;
    background: var(--danger-soft);
  }
  .confirm-title {
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 750;
  }
  .confirm-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .empty {
    margin: 40px auto 0;
    max-width: 440px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .empty h2 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .empty p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
  }
  .toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 18px;
    max-width: 728px;
    margin: 0 auto;
    padding: 12px 14px;
    border-radius: 8px;
    background: #14171f;
    color: #fff;
    font-size: 14px;
    box-shadow: var(--shadow);
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    .compare { gap: 6px; }
    .home-nav { grid-template-columns: 1fr; }
    .content { padding: 8px; }
    .measure-head, .row, .actions { padding: 8px; }
    .measure-title { font-size: 13px; }
    .value { font-size: 12px; }
    .btn { font-size: 12px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>Навигатор льгот</h1>
      <div class="hint" id="subtitle">Загрузка...</div>
    </div>
    <button class="btn" id="close-btn" type="button">Закрыть</button>
  </header>

  <section class="content">
    <div class="empty" id="state" role="status">
      <h2>Загружаем данные</h2>
      <p>Открываем ваши данные и меры поддержки.</p>
    </div>

    <div class="home" id="home" hidden></div>
    <div class="compare" id="compare" hidden></div>
    <article class="details" id="details" hidden></article>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="https://st.max.ru/js/max-web-app.js"></script>
<script>
(() => {
  const api = {
    home: "/api/miniapp/home",
    compare: "/api/miniapp/compare",
    checklist: id => `/api/miniapp/checklist/${encodeURIComponent(id)}`
  };
  const webApp = window.WebApp || null;
  const initData = webApp && typeof webApp.initData === "string" ? webApp.initData : "";
  const stateEl = document.getElementById("state");
  const homeEl = document.getElementById("home");
  const compareEl = document.getElementById("compare");
  const detailsEl = document.getElementById("details");
  const subtitleEl = document.getElementById("subtitle");
  const toastEl = document.getElementById("toast");
  let measures = [];
  let busyId = null;
  let confirmId = null;

  document.getElementById("close-btn").addEventListener("click", closeApp);

  function idsFromStartParam() {
    const startParam = webApp && webApp.initDataUnsafe && typeof webApp.initDataUnsafe.start_param === "string"
      ? webApp.initDataUnsafe.start_param
      : "";
    const match = startParam.match(/^compare_([0-9a-fA-F-]{36})_([0-9a-fA-F-]{36})$/);
    return match ? [match[1], match[2]] : [];
  }

  function headers() {
    return { "X-Max-Init-Data": initData };
  }

  function showState(title, text) {
    stateEl.hidden = false;
    homeEl.hidden = true;
    compareEl.hidden = true;
    detailsEl.hidden = true;
    stateEl.innerHTML = `<h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p>`;
    subtitleEl.textContent = title;
  }

  function showLoading() {
    stateEl.hidden = false;
    homeEl.hidden = true;
    compareEl.hidden = true;
    detailsEl.hidden = true;
    stateEl.innerHTML = `<h2>Загружаем данные</h2><p><span class="spinner"></span></p>`;
    subtitleEl.textContent = "Загрузка...";
  }

  async function loadCompare(keepDetailsId = null) {
    const ids = idsFromStartParam();
    if (!initData) {
      showState("Откройте из MAX", "Мини-приложение получает доступ к профилю только при запуске из чата.");
      return;
    }
    if (ids.length !== 2) {
      await loadHome();
      return;
    }

    showLoading();
    try {
      const url = `${api.compare}?ids=${encodeURIComponent(ids.join(","))}`;
      const res = await fetch(url, { headers: headers() });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      measures = Array.isArray(data.measures) ? data.measures.slice(0, 2) : [];
      if (measures.length !== 2) {
        showState("Нет данных для сравнения", "Не удалось получить две меры. Попробуйте открыть сравнение заново из чата.");
        return;
      }
      renderCompare();
      if (keepDetailsId) renderDetails(keepDetailsId, false);
    } catch (err) {
      showState("Не удалось загрузить меры", "Проверьте соединение и откройте сравнение ещё раз.");
    }
  }

  async function loadHome() {
    if (!initData) {
      showState("Откройте из MAX", "Мини-приложение получает доступ к профилю только при запуске из чата.");
      return;
    }

    showLoading();
    try {
      const res = await fetch(api.home, { headers: headers() });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderHome(await res.json());
    } catch (err) {
      showState("Не удалось открыть меню", "Проверьте соединение и попробуйте ещё раз из чата.");
    }
  }

  function renderHome(data) {
    const recommendations = Array.isArray(data.recommendations) ? data.recommendations : [];
    const checklist = Array.isArray(data.checklist) ? data.checklist : [];
    const profileText = data.profile_text || "Профиль пока не заполнен.";
    stateEl.hidden = true;
    compareEl.hidden = true;
    detailsEl.hidden = true;
    homeEl.hidden = false;
    subtitleEl.textContent = "Меню подбора мер";
    document.querySelector("h1").textContent = "Навигатор льгот";
    homeEl.innerHTML = `
      <nav class="home-nav" aria-label="Разделы">
        <a class="nav-card" href="#profile"><span class="nav-title">Профиль</span><span class="nav-meta">${escapeHtml(data.profile_complete ? "готов" : "нужно уточнить")}</span></a>
        <a class="nav-card" href="#recommendations"><span class="nav-title">Подбор</span><span class="nav-meta">${escapeHtml(countText(recommendations.length, "мера", "меры", "мер"))}</span></a>
        <a class="nav-card" href="#checklist"><span class="nav-title">Чек-лист</span><span class="nav-meta">${escapeHtml(countText(checklist.length, "пункт", "пункта", "пунктов"))}</span></a>
      </nav>

      <section class="home-card" id="profile">
        <div class="home-card-head"><h2>Профиль компании</h2></div>
        <div class="home-body">
          <p class="profile-text">${escapeHtml(profileText)}</p>
          ${data.profile_complete ? "" : `<p class="home-note">Вернитесь в чат и отправьте ИНН сообщением. Если профиль уже частично заполнен — уточните данные через /start.</p>`}
        </div>
      </section>

      <section class="home-card" id="recommendations">
        <div class="home-card-head"><h2>Персональные меры</h2></div>
        <div class="home-body">
          ${recommendations.length ? `<div class="recommendations">${recommendations.map(renderHomeRecommendation).join("")}</div>` : `<p class="profile-text">Пока нет подходящих мер. Уточните профиль в чате, чтобы расширить подбор.</p>`}
        </div>
      </section>

      <section class="home-card" id="checklist">
        <div class="home-card-head"><h2>Мой чек-лист</h2></div>
        <div class="home-body">
          ${checklist.length ? `<ul class="checklist-list">${checklist.map(item => `<li>${escapeHtml(item.name || "Мера поддержки")}</li>`).join("")}</ul>` : `<p class="profile-text">В чек-листе пока пусто. Добавляйте меры из подбора, чтобы не потерять их.</p>`}
        </div>
      </section>
    `;
  }

  function renderHomeRecommendation(m) {
    const reasons = Array.isArray(m.reasons) ? m.reasons.filter(Boolean) : [];
    return `
      <article class="recommendation">
        <span class="badge">${escapeHtml(levelName(m.support_level))}</span>
        <div class="recommendation-title">${escapeHtml(m.name || "Мера поддержки")}</div>
        <div class="recommendation-amount">${escapeHtml(m.amount_display || "Сумма уточняется")}</div>
        ${reasons.length ? `<ul class="reason-list">${reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>` : ""}
      </article>
    `;
  }

  function renderCompare() {
    stateEl.hidden = true;
    homeEl.hidden = true;
    compareEl.hidden = false;
    if (!confirmId) detailsEl.hidden = true;
    document.querySelector("h1").textContent = "Сравнение мер";
    subtitleEl.textContent = "2 меры из вашего подбора";
    compareEl.innerHTML = measures.map(renderMeasure).join("");
    compareEl.querySelectorAll("[data-open]").forEach(btn => {
      btn.addEventListener("click", () => renderDetails(btn.dataset.open));
    });
    compareEl.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => toggleChecklist(btn.dataset.toggle));
    });
  }

  function renderMeasure(m) {
    const docs = Array.isArray(m.documents) ? m.documents.length : 0;
    return `
      <section class="measure">
        <div class="measure-head">
          <span class="badge">${escapeHtml(levelName(m.support_level))}</span>
          <div class="measure-title">${escapeHtml(m.name || "Без названия")}</div>
        </div>
        ${row("Сумма", m.amount_display)}
        ${row("Срок", m.review_days ? `${m.review_days} дн.` : "")}
        ${row("Документы", docs ? `${docs}` : "Уточняются")}
        ${row("Кто может получить", m.who_can_receive)}
        <div class="actions">
          <button class="btn btn-primary" type="button" data-open="${escapeAttr(m.id)}">Подробнее</button>
          <button class="btn ${m.checklisted ? "btn-ok" : ""}" type="button" data-toggle="${escapeAttr(m.id)}" ${busyId === m.id ? "disabled" : ""}>
            ${buttonText(m)}
          </button>
        </div>
      </section>
    `;
  }

  function row(label, value) {
    return `
      <div class="row">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(value || "Уточняется")}</div>
      </div>
    `;
  }

  function renderDetails(id, scroll = true) {
    const m = measures.find(item => item.id === id);
    if (!m) return;
    const docs = Array.isArray(m.documents) && m.documents.length
      ? `<ul class="docs">${m.documents.map(doc => `<li>${escapeHtml(doc)}</li>`).join("")}</ul>`
      : "<p>Документы уточняются в первоисточнике.</p>";
    detailsEl.hidden = false;
    detailsEl.innerHTML = `
      <div class="details-head">
        <div>
          <span class="badge">${escapeHtml(levelName(m.support_level))}</span>
          <h2 class="details-title">${escapeHtml(m.name || "Без названия")}</h2>
        </div>
        <button class="icon-btn" type="button" data-close-details aria-label="Свернуть">x</button>
      </div>
      <div class="section"><h3>Сумма</h3><p>${escapeHtml(m.amount_display || "Уточняется")}</p></div>
      <div class="section"><h3>Что это</h3><p>${escapeHtml(m.what_is_it || "Описание уточняется в первоисточнике.")}</p></div>
      <div class="section"><h3>Кто может получить</h3><p>${escapeHtml(m.who_can_receive || "Условия уточняются в первоисточнике.")}</p></div>
      <div class="section"><h3>Документы</h3>${docs}</div>
      <div class="actions">
        <button class="btn ${m.checklisted ? "btn-ok" : "btn-primary"}" type="button" data-detail-toggle ${busyId === m.id ? "disabled" : ""}>
          ${buttonText(m)}
        </button>
      </div>
      ${confirmId === id ? confirmRemove(id) : ""}
    `;
    detailsEl.querySelector("[data-close-details]").addEventListener("click", () => {
      detailsEl.hidden = true;
      confirmId = null;
    });
    detailsEl.querySelector("[data-detail-toggle]").addEventListener("click", () => toggleChecklist(id));
    const removeBtn = detailsEl.querySelector("[data-confirm-remove]");
    if (removeBtn) removeBtn.addEventListener("click", () => toggleChecklist(id, true));
    const cancelBtn = detailsEl.querySelector("[data-cancel-remove]");
    if (cancelBtn) cancelBtn.addEventListener("click", () => {
      confirmId = null;
      renderDetails(id);
    });
    if (scroll) detailsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function confirmRemove(id) {
    const m = measures.find(item => item.id === id);
    return `
      <div class="confirm">
        <div class="confirm-title">Убрать «${escapeHtml((m && m.name) || "меру")}» из чек-листа?</div>
        <div class="confirm-actions">
          <button class="btn btn-danger" type="button" data-confirm-remove>Убрать</button>
          <button class="btn" type="button" data-cancel-remove>Отмена</button>
        </div>
      </div>
    `;
  }

  async function toggleChecklist(id, confirmed = false) {
    const m = measures.find(item => item.id === id);
    if (!m || busyId) return;
    if (m.checklisted && !confirmed) {
      confirmId = id;
      renderDetails(id);
      return;
    }
    busyId = id;
    const wasChecklisted = Boolean(m.checklisted);
    renderCompare();
    if (!detailsEl.hidden) renderDetails(id, false);
    try {
      const res = await fetch(api.checklist(id), {
        method: wasChecklisted ? "DELETE" : "POST",
        headers: headers()
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      busyId = null;
      confirmId = null;
      await loadCompare(id);
      showToast(wasChecklisted ? "Убрано из чек-листа" : "Добавлено в чек-лист");
    } catch (err) {
      busyId = null;
      showToast("Не удалось обновить чек-лист. Попробуйте ещё раз.");
      renderCompare();
      if (!detailsEl.hidden) renderDetails(id, false);
    } finally {
      busyId = null;
      confirmId = null;
    }
  }

  function buttonText(m) {
    if (busyId === m.id) return "Обновляем...";
    return m.checklisted ? "В чек-листе" : "В чек-лист";
  }

  function levelName(level) {
    return { federal: "Федеральная", regional: "Региональная", municipal: "Муниципальная" }[level]
      || "Мера поддержки";
  }

  function countText(count, one, few, many) {
    const mod10 = count % 10;
    const mod100 = count % 100;
    const word = mod10 === 1 && mod100 !== 11 ? one : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? few : many;
    return `${count} ${word}`;
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => { toastEl.hidden = true; }, 2200);
  }

  function closeApp() {
    if (webApp && typeof webApp.close === "function") {
      webApp.close();
      return;
    }
    showToast("Закрыть окно можно кнопкой назад в MAX.");
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(value) {
    return escapeHtml(value).replaceAll("`", "&#096;");
  }

  loadCompare();
})();
</script>
</body>
</html>
